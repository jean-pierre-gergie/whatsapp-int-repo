<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./static/css/bootstrap.css">
    <link rel="stylesheet" href="./static/css/app.css">
    <link rel="stylesheet" href="./static/css/sidebar.css"> 
    <link rel="shortcut icon" href="./static/images/favicon.svg" type="image/x-icon">
    <script src="https://www.google.com/recaptcha/api.js?render=6LcBZ-sqAAAAAMG1MFBcXRerkZRikAfuwlF5bJvF"></script>
</head>
<body>
    <div id="auth" class="container">
        <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6 col-12">
                <br><br><br><br><br><br>
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title text-center">Login</h4>
                        <form id="loginForm">
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input type="text" id="username" name="username" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" id="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Login</button>
                        </form>
                        <div id="error-message" class="text-danger mt-3"></div> 
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent default form submission
            console.log("[Frontend] Login form submit event fired.");

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            grecaptcha.ready(async function() {
                // Execute reCAPTCHA with 'login' as the action (you can rename 'login' if desired)
                const token = await grecaptcha.execute('6LcBZ-sqAAAAAMG1MFBcXRerkZRikAfuwlF5bJvF', {action: 'login'});

                if (!token) {
                    console.log("[Frontend] No reCAPTCHA token; stopping submission.");
                    document.getElementById('error-message').textContent = 'Please complete the reCAPTCHA.';
                    return;
                }
                // console.log("[Frontend] reCAPTCHA token received:", token);

                try {
                    const response = await fetch('/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({
                            username,
                            password,
                            'g-recaptcha-response': token // Include the v3 token
                        })
                    });
                    // console.log("[Frontend] Response from backend:", response);

                    const data = await response.json();    // + now always parse JSON
                    const SAME_ORIGIN = window.location.origin;

                    if (response.ok) {                                   // data.next is guaranteed now
                        const target = new URL(data.next || '/index', SAME_ORIGIN);
                      if (target.origin === SAME_ORIGIN) {
                          window.location.assign(target.pathname + target.search + target.hash);
                      } else {
                          console.warn('Blocked cross-origin redirect:', target.href);
                          document.getElementById('error-message').textContent = 'Unexpected redirect – please try again.';
                      }
                  } else {                               // + error path
                      document.getElementById('error-message').textContent = data.msg || 'Login failed';
                  }
                } catch (error) {
                    console.error('Error:', error);
                    document.getElementById('error-message').textContent = 'An error occurred. Please try again.';
                }
            });
        });
    </script>
</body>
</html>
