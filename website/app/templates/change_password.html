<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendors/iconly/bold.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendors/perfect-scrollbar/perfect-scrollbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendors/bootstrap-icons/bootstrap-icons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="stylesheet" href="./static/css/sidebar.css"> 
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/x-icon">
</head>
<body>
    <div id="app">

        {% include 'sidebar.html' %}
        
        <div id="main">
            <div class="page-heading">
                <div class="page-title">
                    <h1>Change Password</h1>
                </div>
                <section class="section">
                    <div class="card">
                        <div class="card-body">
                            {% with messages = get_flashed_messages(with_categories=true) %}
                                {% if messages %}
                                    <div class="mt-3">
                                        {% for category, message in messages %}
                                            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                                <i class="bi bi-info-circle"></i> {{ message }}
                                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                            </div>
                                        {% endfor %}
                                    </div>
                                {% endif %}
                            {% endwith %}
                            <form method="POST" action="{{ url_for('auth.change_password') }}">
                                <div class="form-group">
                                    <label for="old_password">Old Password</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="old_password" name="old_password" required>
                                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('old_password')">
                                            <i class="bi bi-eye-slash" id="toggleOldPassword"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="new_password">New Password</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="new_password" name="new_password" required>
                                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('new_password')">
                                            <i class="bi bi-eye-slash" id="toggleNewPassword"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="confirm_password">Confirm Password</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirm_password')">
                                            <i class="bi bi-eye-slash" id="toggleConfirmPassword"></i>
                                        </button>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary mt-3">Change Password</button>
                            </form>
                            
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='vendors/perfect-scrollbar/perfect-scrollbar.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendors/apexcharts/apexcharts.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/dashboard.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    <script>
        function togglePassword() {
            // Get all password fields
            const passwordFields = document.querySelectorAll('input[type="password"], input[type="text"]');
            const icons = document.querySelectorAll('.bi-eye-slash, .bi-eye');
            
            // Toggle visibility for all password fields
            passwordFields.forEach((input, index) => {
                if (input.type === 'password') {
                    input.type = 'text';
                    icons[index].classList.remove('bi-eye-slash');
                    icons[index].classList.add('bi-eye');
                } else {
                    input.type = 'password';
                    icons[index].classList.remove('bi-eye');
                    icons[index].classList.add('bi-eye-slash');
                }
            });
        }
    </script>

</body>
</html>
