<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./static/css/bootstrap.css">

    <link rel="stylesheet" href="./static/vendors/iconly/bold.css">
    <link rel="stylesheet" href="./static/vendors/perfect-scrollbar/perfect-scrollbar.css">
    <link rel="stylesheet" href="./static/vendors/bootstrap-icons/bootstrap-icons.css">
    <link rel="stylesheet" href="./static/css/app.css">
    <link rel="stylesheet" href="./static/css/sidebar.css">
    <link rel="shortcut icon" href="./static/images/favicon.svg" type="image/x-icon">
</head>

<body>
    <div id="app">
        {% include 'sidebar.html' %}
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="container mt-3">
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
                </div>
            {% endif %}
            {% endwith %}
        <div class="container mt-5">
            <h2>Add New User</h2>
            <form id="addUserForm" method="POST" action="/add_user">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" autocomplete="off" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" required>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
                    <span id="passwordError" class="text-danger" style="display: none; font-size: 0.9em;">
                        Passwords do not match.
                    </span>
                </div>
                <div class="mb-3">
                    <label for="role" class="form-label">Role</label>
                    <select class="form-select" id="role" name="role" required>
                        <option value="admin">Admin</option>
                        <option value="user">User</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Foundations</label>
                    <div id="foundationsContainer" class="d-flex flex-wrap gap-2">
                        <!-- Buttons for foundations will be dynamically populated here -->
                    </div>
                    <input type="hidden" id="selectedFoundations" name="foundations">
                </div>
                <div class="mb-3">
                    <label for="defaultFoundation" class="form-label">Default Foundation</label>
                    <select class="form-select" id="defaultFoundation" name="defaultFoundation" required>
                        <!-- Default Foundation options will be dynamically populated -->
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Create User</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const foundationsContainer = document.getElementById('foundationsContainer');
            const defaultFoundationSelect = document.getElementById('defaultFoundation');
            const selectedFoundationsInput = document.getElementById('selectedFoundations');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const passwordError = document.getElementById('passwordError'); // Password error message span
            const form = document.getElementById('addUserForm');

            let selectedFoundations = [];

            // Fetch foundations and generate buttons
            fetch('/get_foundations')
                .then(response => response.json())
                .then(data => {
                    data.foundations.forEach(foundation => {
                        const button = document.createElement('button');
                        button.type = 'button';
                        button.className = 'btn btn-outline-primary foundation-button';
                        button.textContent = foundation;
                        button.dataset.value = foundation;

                        button.addEventListener('click', () => toggleFoundation(button));
                        foundationsContainer.appendChild(button);
                    });
                })
                .catch(error => console.error('Error fetching foundations:', error));

            // Toggle foundation selection
            function toggleFoundation(button) {
                const foundation = button.dataset.value;

                if (selectedFoundations.includes(foundation)) {
                    selectedFoundations = selectedFoundations.filter(f => f !== foundation);
                    button.classList.remove('btn-primary');
                    button.classList.add('btn-outline-primary');
                } else {
                    selectedFoundations.push(foundation);
                    button.classList.remove('btn-outline-primary');
                    button.classList.add('btn-primary');
                }

                selectedFoundationsInput.value = selectedFoundations.join(',');
                updateDefaultFoundationOptions();
            }

            // Update the default foundation dropdown
            function updateDefaultFoundationOptions() {
                defaultFoundationSelect.innerHTML = '';
                selectedFoundations.forEach(foundation => {
                    const option = document.createElement('option');
                    option.value = foundation;
                    option.textContent = foundation;
                    defaultFoundationSelect.appendChild(option);
                });
            }

            // Dynamic password validation logic
            function checkPasswordsMatch() {
                if (confirmPasswordInput.value.length > 0) {
                    if (passwordInput.value !== confirmPasswordInput.value) {
                        passwordError.classList.remove('d-none'); // Show error
                    } else {
                        passwordError.classList.add('d-none'); // Hide error
                    }
                } else {
                    passwordError.classList.add('d-none'); // Hide error when confirm password is empty
                }
            }

            // Password validation for form submission
            function validatePasswords() {
                if (passwordInput.value !== confirmPasswordInput.value) {
                    passwordError.classList.remove('d-none'); // Show error
                    return false;
                } else {
                    passwordError.classList.add('d-none'); // Hide error
                    return true;
                }
            }

            // Form submission validation
            form.addEventListener('submit', function (event) {
                if (!validatePasswords()) {
                    event.preventDefault();
                    alert('Please ensure passwords match.');
                }
                if (selectedFoundations.length === 0) {
                    event.preventDefault();
                    alert('Please select at least one foundation.');
                }
            });

            // Real-time validation listeners
            passwordInput.addEventListener('input', checkPasswordsMatch);
            confirmPasswordInput.addEventListener('input', checkPasswordsMatch);
        });
    </script>

    <script src="./static/vendors/perfect-scrollbar/perfect-scrollbar.min.js"></script>
    <script src="./static/js/bootstrap.bundle.min.js"></script>
    <script src="./static/vendors/apexcharts/apexcharts.js"></script>
    <script src="./static/js/pages/dashboard.js"></script>
    <script src="./static/js/main.js"></script>
</body>

</html>
