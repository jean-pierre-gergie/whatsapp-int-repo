server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.+)
        target_label: container_name
      - source_labels: [__meta_docker_container_id]
        target_label: container_id
      - source_labels: [__meta_docker_image]
        target_label: container_image
      - source_labels: [__meta_docker_label_com_docker_compose_service]
        target_label: compose_service
      - source_labels: [__meta_docker_label_com_docker_compose_project]
        target_label: compose_project
      - source_labels: [__meta_docker_label_org_opencontainers_image_created]
        target_label: image_created
      - action: labeldrop
        regex: "__meta.*"

  # Keep static configs for raw log scraping if necessary
  - job_name: docker-raw
    static_configs:
      - targets:
          - localhost
        labels:
          job: "docker-raw-logs"
          __path__: /var/lib/docker/containers/*/*.log
