version: '3.8'

services:

  website:
    build: 
      context: ./website  
      dockerfile: Dockerfile
    container_name: website_container
    restart: unless-stopped
    ports:
      - "1313:1313"  # Exposes the Flask app on port 1313

    env_file: 
      - .env  # Loads environment variables from the .env 
      
    volumes:
      - ./website:/app  # Mounts the current directory to the container's /app directory
    depends_on:
      - mongodb
      - webhook_fa
    networks:
      - network_internal

  webhook_fa:
    build: 
      context: ./webhook_fa  
      dockerfile: Dockerfile
    container_name: webhook_fa_container
    restart: unless-stopped
    ports:
      - "5000:5000"  # Exposes the FastAPI app on port 5000
    env_file: 
      - .env  # Loads environment variables from the .env file
    volumes:
      - ./webhook_fa:/app  # Mounts the current directory to the container's /app directory
    depends_on:
      - mongodb
      - agent

    networks:
      - network_internal

  agent:
    build:
      context: ./agent 
    container_name: agent
    restart: unless-stopped
    ports:
      - "5001:5001"  # Exposes the FastAPI app on port 5000
    env_file: 
      - .env  # Loads environment variables from the .env file
    volumes:
      - ./agent:/app  # Mounts the current directory to the container's /app directory
    depends_on:
      - mongodb

    networks:
      - network_internal

  microservice:
    build: 
      context: ./microservice  # Specifies the directory containing your FastAPI app
      dockerfile: Dockerfile
    container_name: microservice
    restart: unless-stopped
    ports:
      - "1616:1616"  # Exposes the FastAPI app on port 1616
    volumes:
      - ./microservice:/app  # Mounts the current directory to the container's /app directory
    env_file:
      - .env  # MongoDB as the result backend
    command: uvicorn app:app --host 0.0.0.0 --port 1616 --reload

    networks:
    - network_internal

  celery_worker:
    build:
      context: ./microservice  # Uses the same codebase for FastAPI and Celery
    container_name: celery_worker
    restart: unless-stopped
    
    volumes:
      - ./microservice:/app


    depends_on:
      - rabbitmq
      - mongodb
    env_file:
      - .env 
    command: celery -A celery_app worker --loglevel=info  # Start Celery worker

    networks:
    - network_internal  

  celery_beat:
    build:
      context: ./microservice  # Uses the same codebase for FastAPI and Celery
    container_name: celery_beat
    restart: unless-stopped
    
    volumes:
      - ./microservice:/app
      # - ./beat_schedule_data/celerybeat-schedule:/app/celerybeat-schedule # Persist the beat schedule

    depends_on:
      - rabbitmq
      - mongodb
    env_file:
      - .env 
    command: celery -A celery_app beat --loglevel=info  # Start Celery beat

    networks:
    - network_internal 


  rabbitmq:
    image: "rabbitmq:3-management"  # RabbitMQ image with management plugin
    container_name: rabbitmq
    ports:
      - "15672:15672"  # RabbitMQ management UI
      - "5672:5672"  # RabbitMQ broker port
    restart: unless-stopped
    env_file:
      - .env 
    networks:
    - network_internal


  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb_container
    restart: unless-stopped
    ports:
      - "27017:27017"  # Exposes MongoDB on port 27017
    volumes:
      - mongo_data:/data/db:z  # Mounts the named volume to the MongoDB data directory
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD} 
    networks:
    - network_internal

  ### logging containers
  loki:
    image: grafana/loki:3.0.0                       # Specifies the Loki Docker image and version.
    container_name: loki                            # Names the container for easier management.
    user: root
    volumes:
      - ./lokiconfigs/loki-config.yaml:/mnt/config/loki-config.yaml
      - ./logs-data:/mnt/data
    ports:
      - "3100:3100"                                 # Maps port 3100 on the host to port 3100 in the container.
    command: -config.file=/mnt/config/loki-config.yaml # Runs Loki with the specified configuration file.

  promtail:
    image: grafana/promtail:3.0.0                   # Specifies the Promtail Docker image and version.
    container_name: promtail                        # Names the container for easier management.
    user: root
    volumes:
      - ./promtailconfigs/promtail-config.yaml:/mnt/config/promtail-config.yaml # Mounts the Promtail configuration file.
      - /var/log:/var/log
      - /var/lib/docker:/var/lib/docker                          # Mounts the host's log directory.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki   
    ports:
      - "9080:9080"                                    # Ensures Promtail starts after Loki.
    command: -config.file=/mnt/config/promtail-config.yaml # Runs Promtail with the specified configuration file.

  grafana:
    image: grafana/grafana:10.0.0                  # Specifies the Grafana Docker image and version.
    container_name: grafana                        # Names the container for easier management.
    user: root
    depends_on:
      - loki                                       # Ensures Grafana starts after Loki.
    ports:
      - "3000:3000"                               # Maps port 3000 on the host to port 3000 in the container.
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning # Mounts provisioning directory for dashboards and datasources.
      - ./grafana-data:/var/lib/grafana            # Persists Grafana data.
    environment:
      - GF_SECURITY_ADMIN_USER=admin              # Sets the default admin username.
      - GF_SECURITY_ADMIN_PASSWORD=admin          # Sets the default admin password.
      - GF_AUTH_ANONYMOUS_ENABLED=false            # Enables anonymous access if required.
      - GF_AUTH_BASIC_ENABLED=true 
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/logs/  # Set root URL for reverse proxy
      - GF_SERVER_SERVE_FROM_SUB_PATH=true  # Enable serving from subpath
volumes:
  mongo_data:
    driver: local
  grafana-data:
  data:

networks:
  network_internal:
    driver: bridge